<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#e85d3f">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>🍜 NomNom Nam</title>
  <meta name="description" content="Tap any dish to hear it pronounced — Vietnamese, Mandarin and Cantonese street food">
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #2e2e2e;
      --text: #f0ede8;
      --text-muted: #888;
      --accent: #e85d3f;
      --accent2: #f4a435;
      --green: #4caf50;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15,15,15,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 14px 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .logo { font-size: 26px; }

    .header-titles { flex: 1; }

    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .dish-count {
      background: var(--accent);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
    }

    /* ── FILTER TABS ── */
    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .filter-tab {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .filter-tab.active {
      color: var(--text);
      background: var(--surface2);
    }

    /* ── FILTER PILLS ── */
    .filters-row {
      overflow-x: auto;
      display: flex;
      gap: 7px;
      padding-bottom: 12px;
      scrollbar-width: none;
    }
    .filters-row::-webkit-scrollbar { display: none; }

    .pill {
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .pill:active { transform: scale(0.94); }

    .pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .pill .pill-icon { font-size: 14px; }

    /* ── GRID ── */
    main {
      padding: 14px 12px 100px;
    }

    .results-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* ── CARD ── */
    .card {
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
      position: relative;
      border: 1px solid var(--border);
    }

    .card:active { transform: scale(0.97); }

    .card-img-wrap {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: var(--surface2);
    }

    .card-img-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s;
      z-index: 1;
    }

    .card-img-wrap img.loading { opacity: 0; }
    .card-img-wrap img.loaded { opacity: 1; }

    .img-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
    }

    .play-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 36px;
      height: 36px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      border: 1.5px solid rgba(255,255,255,0.15);
      transition: transform 0.15s;
      z-index: 2;
    }

    .card:active .play-badge { transform: scale(1.15); }

    .play-badge.playing {
      background: var(--accent);
      border-color: var(--accent);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232,93,63,0.5); }
      50% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(232,93,63,0); }
    }

    .card-body {
      padding: 10px 10px 11px;
    }

    .card-vi {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 3px;
    }

    .card-en {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }

    .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      background: var(--surface2);
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .tag.region { background: rgba(244,164,53,0.15); color: var(--accent2); }
    .tag.city   { background: rgba(76,175,80,0.15);  color: var(--green); }

    /* ── DETAIL SHEET ── */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      backdrop-filter: blur(4px);
    }

    .sheet-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 201;
      background: var(--surface);
      border-radius: 0;
      transform: translateY(100%);
      transition: transform 0.38s cubic-bezier(0.34, 1.10, 0.64, 1);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }

    .sheet.open {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 12px auto 0;
    }

    .sheet-img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      margin-top: 10px;
    }

    .sheet-content {
      padding: 16px 20px 24px;
    }

    .sheet-name-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .sheet-name-col { flex: 1; min-width: 0; }

    .sheet-vi-name {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .sheet-en-name {
      font-size: 17px;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 6px;
    }

    .sheet-pronunciation {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border-radius: 10px;
      padding: 7px 12px;
      margin-bottom: 14px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .pron-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    .pron-text { font-weight: 700; color: var(--text); font-style: italic; font-size: 15px; }

    .sheet-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .meta-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
    }

    .meta-chip.region { border-color: rgba(244,164,53,0.4); background: rgba(244,164,53,0.08); color: var(--accent2); }
    .meta-chip.city   { border-color: rgba(76,175,80,0.4);  background: rgba(76,175,80,0.08);  color: var(--green); }
    .meta-chip.type   { border-color: rgba(240,237,232,0.15); color: var(--text-muted); }

    .sheet-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .ingredients-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .ingredient-chip {
      font-size: 13px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .sheet-description {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* ── SPEAK BUTTON ── */
    .speak-btn {
      flex-shrink: 0;
      width: 72px;
      height: 72px;
      padding: 0;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.2s;
    }

    .speak-btn:active { transform: scale(0.97); }

    .speak-btn.playing {
      background: #c0392b;
      animation: speakPulse 0.8s infinite;
    }

    @keyframes speakPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(232,93,63,0.5); }
      50% { box-shadow: 0 0 0 16px rgba(232,93,63,0); }
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state .emoji { font-size: 48px; margin-bottom: 12px; display: block; }
    .empty-state p { font-size: 15px; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── PLAYING INDICATOR ── */
    .now-playing-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 150;
      background: var(--accent);
      transform: translateY(100%);
      transition: transform 0.3s;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 8px));
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
    }

    .now-playing-bar.visible { transform: translateY(0); }

    .sound-waves {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .wave-bar {
      width: 3px;
      background: white;
      border-radius: 2px;
      animation: wave 0.8s infinite ease-in-out;
    }

    .wave-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
    .wave-bar:nth-child(2) { height: 16px; animation-delay: 0.15s; }
    .wave-bar:nth-child(3) { height: 12px; animation-delay: 0.3s; }
    .wave-bar:nth-child(4) { height: 20px; animation-delay: 0.1s; }
    .wave-bar:nth-child(5) { height: 10px; animation-delay: 0.25s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.5); }
      50% { transform: scaleY(1.2); }
    }

    /* ── TABLET / DESKTOP ── */
    @media (min-width: 520px) {
      .grid { grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
      main { padding: 16px 16px 100px; }
    }

    @media (min-width: 900px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* ── MODE TABS (Dishes / Phrases) ── */
    .mode-tabs {
      display: flex;
      gap: 6px;
      padding-bottom: 10px;
    }

    .mode-tab {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
      padding: 9px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* ── SEARCH BAR ── */
    .search-wrap {
      display: flex;
      align-items: center;
      background: var(--surface2);
      border-radius: 12px;
      padding: 0 12px;
      gap: 8px;
      margin-bottom: 10px;
      border: 1.5px solid var(--border);
      transition: border-color 0.2s;
    }

    .search-wrap:focus-within { border-color: var(--accent); }

    .search-icon { color: var(--text-muted); font-size: 15px; flex-shrink: 0; }

    .search-input {
      flex: 1;
      background: none;
      border: none;
      color: var(--text);
      font-size: 15px;
      padding: 10px 0;
      outline: none;
    }

    .search-input::placeholder { color: var(--text-muted); }

    .search-clear {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 4px;
      display: none;
      border-radius: 50%;
      transition: color 0.15s;
    }

    .search-clear.visible { display: block; }
    .search-clear:hover { color: var(--text); }

    /* ── PHRASE CARDS ── */
    #phraseGrid { display: none; padding: 12px 16px 100px; }

    .phrase-category-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      padding: 18px 0 8px;
    }

    .phrase-category-label:first-child { padding-top: 4px; }

    .phrase-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .phrase-card:active { transform: scale(0.98); }

    .phrase-card.playing { border-color: var(--accent); background: rgba(232,93,63,0.07); }

    .phrase-text { flex: 1; min-width: 0; }

    .phrase-vi {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.3px;
      margin-bottom: 3px;
    }

    .phrase-en {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .phrase-pron {
      font-size: 12px;
      font-style: italic;
      color: var(--accent2);
      font-weight: 600;
    }

    .phrase-play {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      background: var(--accent);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.2s;
    }

    .phrase-card.playing .phrase-play { background: #c0392b; }

    /* ── COUNTRY SWITCHER ── */
    .country-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface2); border: 1.5px solid var(--border);
      color: var(--text); border-radius: 20px; padding: 5px 10px 5px 8px;
      font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    }
    .country-btn:active { transform: scale(0.96); }
    .country-flag { font-size: 18px; line-height: 1; }
    .country-caret { color: var(--text-muted); font-size: 10px; }
    @media (max-width: 380px) { .country-name { display: none; } .subtitle { display: none; } }

    .offline-status {
      font-size: 11px; color: var(--accent2); margin: -6px 0 8px; display: none;
    }
    .offline-status.visible { display: block; }

    .country-overlay { z-index: 300; }
    .country-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 301;
      background: var(--surface); border-radius: 22px 22px 0 0;
      max-width: 560px; margin: 0 auto;
      padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateY(105%); transition: transform 0.32s cubic-bezier(0.34, 1.10, 0.64, 1);
      max-height: 85dvh; overflow-y: auto; border: 1px solid var(--border); border-bottom: none;
    }
    .country-sheet.open { transform: translateY(0); }
    .country-sheet-title { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; margin: 14px 4px 12px; }
    .country-sheet-note { font-size: 12px; color: var(--text-muted); margin: 10px 4px 0; line-height: 1.5; }
    .country-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 8px;
      border-radius: var(--radius); border: 1.5px solid var(--border); background: var(--surface2); cursor: pointer;
    }
    .country-row.active { border-color: var(--accent); background: rgba(232,93,63,0.08); }
    .country-row:active { transform: scale(0.98); }
    .country-row-flag { font-size: 34px; line-height: 1; }
    .country-row-text { flex: 1; min-width: 0; }
    .country-row-name { font-size: 17px; font-weight: 800; }
    .country-row-native { font-weight: 600; color: var(--text-muted); font-size: 14px; margin-left: 4px; }
    .country-row-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .country-row-status { font-size: 11px; color: var(--accent2); margin-top: 3px; font-weight: 600; }
    .country-row-status.ok { color: var(--green); }
    .country-row-check { color: var(--accent); font-weight: 900; font-size: 18px; }
    .offline-btn {
      background: transparent; color: var(--text); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }

    /* ── FILTER EXTRAS ── */
    .filter-tab.has-value { color: var(--accent2); }
    .filter-tabs { overflow-x: auto; scrollbar-width: none; }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .pill-count { font-size: 11px; opacity: 0.6; font-weight: 700; }
    .pill.scope { border-style: dashed; color: var(--accent2); border-color: rgba(244,164,53,0.5); }
    .pill-x { font-size: 11px; opacity: 0.8; }

    /* ── CJK NAMES ── */
    .cjk { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "PingFang HK", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; letter-spacing: 0.5px; }
    .card-vi.cjk { font-size: 20px; }
    .card-roman { font-size: 12px; color: var(--accent2); font-weight: 600; margin-bottom: 2px; }
    .sheet-roman { font-size: 18px; color: var(--accent2); font-weight: 700; margin-bottom: 4px; }
    .sheet-vi-name.cjk { font-size: 44px; letter-spacing: 1px; }
    .lang-flag {
      position: absolute; top: 8px; left: 8px; z-index: 2;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(6px); color: white;
      font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 10px;
    }
    .meta-chip.country { border-color: rgba(240,237,232,0.25); color: var(--text); }

    .iconic-star {
      position: absolute; top: 7px; right: 7px; z-index: 2; font-size: 13px;
      background: rgba(0,0,0,0.55); border-radius: 50%; width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
    }
    .pill.must-try { border-color: rgba(244,164,53,0.5); color: var(--accent2); }
    .pill.must-try.active { background: var(--accent2); border-color: var(--accent2); color: #1a1a1a; }
    .filters-row:empty { display: none; }

    /* ── PHRASE LANGUAGE TABS ── */
    .phrase-lang-tabs { display: flex; gap: 7px; padding: 4px 0 2px; }
    .phrase-lang-note { font-size: 12px; color: var(--text-muted); padding: 6px 2px 0; }
    .lang-badge { font-size: 13px; font-weight: 800; }
    .phrase-roman { font-size: 13px; color: var(--accent2); font-weight: 600; margin-bottom: 2px; }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-top">
    <span class="logo">🍜</span>
    <div class="header-titles">
      <h1>NomNom Nam</h1>
      <div class="subtitle" id="subtitle">Tap any dish · Aunty will know what you want</div>
    </div>
    <button class="country-btn" id="countryBtn" onclick="openCountryPicker()" aria-label="Change country">
      <span class="country-flag" id="countryFlag">🇻🇳</span>

          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="white"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

<script>
// ═══════════════════════════════════════════════
// COUNTRIES
// Each country's dishes, phrases, regions, cities and types live in
// data/<id>.json. Hierarchy: Country → Region → City → Dish.
// ═══════════════════════════════════════════════
const COUNTRIES = [
  {
    id: "vn", name: "Vietnam", native: "Việt Nam", flag: "🇻🇳", dishCount: 72,
    subtitle: "Tap any dish · Aunty will know what you want",
    langs: { vi: { tts: "vi-VN", label: "Vietnamese", short: "VI" } }
  },
  {
    id: "cn", name: "China", native: "中国", flag: "🇨🇳", dishCount: 1275,
    subtitle: "Tap any dish · Show the characters, play the sound",
    langs: {
      "zh-CN": { tts: "zh-CN", label: "Mandarin",  short: "普" },
      "yue":   { tts: "zh-HK", label: "Cantonese", short: "粵" }
    }
  }
];

const MEDIA_CACHE = "nnn-media-v1";
const PHRASE_CATEGORIES = ["Ordering", "Paying", "Dietary", "Compliments", "Basics"];
const CATEGORY_EMOJI = { Ordering:"🛎️", Paying:"💵", Dietary:"🥗", Compliments:"😋", Basics:"👋" };

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let country = COUNTRIES[0];   // active country meta
let data = null;              // active country data (dishes, phrases, regions, cities, types)
const dataCache = {};         // id → loaded data

let activeGroup = "all";      // which pill row is showing: all | region | city | type
let activeRegion = null;
let activeCity = null;
let activeType = null;
let mustTry = false;         // show only must-try (iconic) dishes
let phraseLang = null;        // selected phrase language for multi-language countries

let currentDish = null;
let currentAudio = null;
let sheetPlaying = false;
let searchQuery = "";
let currentMode = "dishes";   // "dishes" | "phrases"
let playingPhraseId = null;

function store(key, val) {
  try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; }
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

const dishById = id => data.dishes.find(d => d.id === id);
const phraseById = id => data.phrases.find(p => p.id === id);
const langOf = item => country.langs[item.lang] || Object.values(country.langs)[0];
const isMultiLang = () => Object.keys(country.langs).length > 1;

// ═══════════════════════════════════════════════
// COUNTRY LOADING / SWITCHING
// ═══════════════════════════════════════════════
async function loadCountryData(id) {
  if (dataCache[id]) return dataCache[id];
  const res = await fetch(`data/${id}.json`);
  if (!res.ok) throw new Error("Failed to load " + id);
  dataCache[id] = await res.json();
  return dataCache[id];
}

async function selectCountry(id, { save = true } = {}) {
  const meta = COUNTRIES.find(c => c.id === id) || COUNTRIES[0];
  stopAudio();
  data = await loadCountryData(meta.id);
  country = meta;
  if (save) store("nnn-country", meta.id);

  // Reset filters & search for the new country
  activeGroup = "all"; activeRegion = activeCity = activeType = null; mustTry = false;
  searchQuery = "";
  document.getElementById("searchInput").value = "";
  document.getElementById("searchClear").classList.remove("visible");
  phraseLang = Object.keys(country.langs)[0];

  document.getElementById("countryFlag").textContent = country.flag;
  document.getElementById("countryName").textContent = country.name;
  document.getElementById("subtitle").textContent = country.subtitle;
  document.documentElement.lang = "en";
  document.querySelectorAll(".filter-tab").forEach(t => t.classList.toggle("active", t.dataset.group === "all"));

  renderPills();
  if (currentMode === "dishes") renderGrid(); else renderPhrases();
  window.scrollTo(0, 0);

  // Save this country's photos & audio for offline use (in the background)
  cacheCountryMedia(country.id);
}

// ═══════════════════════════════════════════════
// OFFLINE MEDIA (per country)
// ═══════════════════════════════════════════════
const offlineState = {}; // id → { done, total, running, complete }

function mediaUrls(d) {
  const urls = [];
  d.dishes.forEach(x => { if (x.img) urls.push(x.img); if (x.audio) urls.push(x.audio); });
  d.phrases.forEach(p => { if (p.audio) urls.push(p.audio); });
  return urls;
}

async function checkOffline(id) {
  if (!("caches" in window)) return null;
  try {
    const d = await loadCountryData(id);
    const cache = await caches.open(MEDIA_CACHE);
    const urls = mediaUrls(d);
    const keys = new Set((await cache.keys()).map(r => new URL(r.url).pathname));
    const base = new URL(".", location.href).pathname;
    const done = urls.filter(u => keys.has(base + u)).length;
    const st = offlineState[id] || (offlineState[id] = {});
    Object.assign(st, { done, total: urls.length, complete: done >= urls.length });
    return st;
  } catch (e) { return null; }
}

async function cacheCountryMedia(id) {
  if (!("caches" in window)) return;
  const st = offlineState[id] || (offlineState[id] = {});
  if (st.running) return;
  try {
    const d = await loadCountryData(id);
    const cache = await caches.open(MEDIA_CACHE);
    const urls = mediaUrls(d);
    const have = new Set((await cache.keys()).map(r => r.url));
    const todo = urls.filter(u => !have.has(new URL(u, location.href).href));
    Object.assign(st, { running: true, total: urls.length, done: urls.length - todo.length, complete: false });
    renderOfflineStatus();
    for (let i = 0; i < todo.length; i += 6) {
      await Promise.allSettled(todo.slice(i, i + 6).map(u => cache.add(u)));
      st.done = Math.min(urls.length, st.done + todo.slice(i, i + 6).length);
      renderOfflineStatus();
    }
    st.complete = true;
  } catch (e) {
    console.warn("[offline] caching failed", e);
  } finally {
    st.running = false;
    renderOfflineStatus();
  }
}

function offlineLabel(id) {
  const st = offlineState[id];
  if (!st || !st.total) return "";
  if (st.running) return `Saving for offline… ${Math.round(100 * st.done / st.total)}%`;
  if (st.complete) return "✓ Available offline";
  return `${Math.round(100 * st.done / st.total)}% saved offline`;
}

function renderOfflineStatus() {
  const el = document.getElementById("offlineStatus");
  const st = offlineState[country.id];
  el.textContent = st && st.running ? offlineLabel(country.id) : "";
  el.classList.toggle("visible", !!(st && st.running));
  if (document.getElementById("countrySheet").classList.contains("open")) renderCountryList();
}

// ═══════════════════════════════════════════════
// COUNTRY PICKER
// ═══════════════════════════════════════════════
function openCountryPicker() {
  renderCountryList();
  document.getElementById("countryOverlay").classList.add("open");
  document.getElementById("countrySheet").classList.add("open");
  history.pushState({ picker: true }, "");
  COUNTRIES.forEach(c => checkOffline(c.id).then(renderCountryList));
}

function closeCountryPicker(fromPop = false) {
  const sheet = document.getElementById("countrySheet");
  if (!sheet.classList.contains("open")) return;
  sheet.classList.remove("open");
  document.getElementById("countryOverlay").classList.remove("open");
  if (!fromPop) history.back();
}

function renderCountryList() {
  document.getElementById("countryList").innerHTML = COUNTRIES.map(c => {
    const st = offlineState[c.id];
    const status = offlineLabel(c.id);
    const showBtn = "caches" in window && !(st && (st.running || st.complete));
    return `
      <div class="country-row ${c.id === country.id ? "active" : ""}" onclick="pickCountry('${c.id}')">
        <span class="country-row-flag">${c.flag}</span>
        <div class="country-row-text">
          <div class="country-row-name">${esc(c.name)} <span class="country-row-native">${esc(c.native)}</span></div>
          <div class="country-row-sub">${c.dishCount} dishes · ${Object.values(c.langs).map(l => l.label).join(" + ")}</div>
          ${status ? `<div class="country-row-status ${st && st.complete ? "ok" : ""}">${status}</div>` : ""}
        </div>
        ${showBtn ? `<button class="offline-btn" onclick="event.stopPropagation(); cacheCountryMedia('${c.id}')" aria-label="Download ${esc(c.name)} for offline">⤓ Offline</button>` : ""}
        ${c.id === country.id ? `<span class="country-row-check">✓</span>` : ""}
      </div>`;
  }).join("");
}

async function pickCountry(id) {
  closeCountryPicker();
  if (id !== country.id) await selectCountry(id);
}

// ═══════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════
function playItem(item, { onStart, onEnd, label }) {
  stopAudio();
  let settled = false;
  let fellBack = false;
  const audio = new Audio(item.audio);
  audio.volume = 1.0;

  const fallback = () => {
    if (fellBack || settled) return;
    fellBack = true;
    audio.oncanplaythrough = audio.onerror = null;
    speakFallback(item, { onStart, onEnd, label });
  };

  audio.addEventListener("canplaythrough", () => {
    if (fellBack || settled) return;
    settled = true;
    currentAudio = audio;
    audio.play().then(() => { showNowPlaying(label); onStart && onStart(); })
      .catch(() => { settled = false; fallback(); });
  }, { once: true });

  audio.addEventListener("ended", () => {
    hideNowPlaying();
    currentAudio = null;
    onEnd && onEnd();
  });

  audio.addEventListener("error", fallback);
  setTimeout(() => { if (!settled && audio.readyState < 3) fallback(); }, 1200);
}

function speakFallback(item, { onStart, onEnd, label }) {
  if (!window.speechSynthesis) { onEnd && onEnd(); return; }
  const lang = langOf(item).tts;
  const utter = new SpeechSynthesisUtterance(item.tts || item.native);
  utter.lang = lang;
  utter.rate = 0.85;
  const voices = speechSynthesis.getVoices();
  const voice = voices.find(v => v.lang.replace("_", "-") === lang) ||
                voices.find(v => v.lang.startsWith(lang.split("-")[0]));
  if (voice) utter.voice = voice;
  utter.onstart = () => { showNowPlaying(label); onStart && onStart(); };
  utter.onend = utter.onerror = () => { hideNowPlaying(); onEnd && onEnd(); };
  speechSynthesis.speak(utter);
}

function playDish(dish, fromSheet = false) {
  updateCardBadge(dish.id, true);
  playItem(dish, {
    label: dish.native,
    onStart: () => { if (fromSheet) setSheetPlaying(true); },
    onEnd: () => { if (fromSheet) setSheetPlaying(false); updateCardBadge(dish.id, false); }
  });
}

function playDishById(id) { const d = dishById(id); if (d) playDish(d); }

function stopAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  hideNowPlaying();
  setSheetPlaying(false);
  document.querySelectorAll(".play-badge.playing").forEach(b => b.classList.remove("playing"));
  document.querySelectorAll(".phrase-card.playing").forEach(c => c.classList.remove("playing"));
}

function updateCardBadge(id, playing) {
  const card = document.querySelector(`.card[data-id="${id}"] .play-badge`);
  if (card) card.classList.toggle("playing", playing);
}

function showNowPlaying(text) {
  document.getElementById("nowPlayingText").textContent = text;
  document.getElementById("nowPlayingBar").classList.add("visible");
}

function hideNowPlaying() {
  document.getElementById("nowPlayingBar").classList.remove("visible");
}

const SPEAKER_SVG = (size = 40) => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="white"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const STOP_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="white"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;

function setSheetPlaying(playing) {
  sheetPlaying = playing;
  const btn = document.getElementById("sheetSpeakBtn");
  if (!btn) return;
  btn.classList.toggle("playing", playing);
  btn.innerHTML = playing ? STOP_SVG : SPEAKER_SVG(40);
}

function speakFromSheet() {
  if (sheetPlaying) stopAudio();
  else if (currentDish) playDish(currentDish, true);
}

// ═══════════════════════════════════════════════
// MODE SWITCHING
// ═══════════════════════════════════════════════
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll(".mode-tab").forEach(t => t.classList.toggle("active", t.dataset.mode === mode));
  const isDishes = mode === "dishes";
  document.getElementById("dishControls").style.display = isDishes ? "" : "none";
  document.getElementById("resultsLabel").style.display = isDishes ? "" : "none";
  document.getElementById("grid").style.display = isDishes ? "" : "none";
  document.getElementById("phraseGrid").style.display = isDishes ? "none" : "block";
  stopAudio();
  if (isDishes) renderGrid(); else renderPhrases();
  window.scrollTo(0, 0);
}

// ═══════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════
function onSearch(e) {
  searchQuery = e.target.value.trim();
  document.getElementById("searchClear").classList.toggle("visible", searchQuery.length > 0);
  renderGrid();
}

function clearSearch() {
  document.getElementById("searchInput").value = "";
  searchQuery = "";
  document.getElementById("searchClear").classList.remove("visible");
  document.getElementById("searchInput").focus();
  renderGrid();
}

// ═══════════════════════════════════════════════
// PHRASES
// ═══════════════════════════════════════════════
function playPhrase(id) {
  const phrase = phraseById(id);
  if (!phrase) return;
  stopAudio();
  playingPhraseId = phrase.id;
  document.querySelectorAll(".phrase-card").forEach(c => c.classList.toggle("playing", c.dataset.id === phrase.id));
  playItem(phrase, {
    label: phrase.native,
    onEnd: () => {
      playingPhraseId = null;
      document.querySelectorAll(".phrase-card").forEach(c => c.classList.remove("playing"));
    }
  });
}

function setPhraseLang(lang) {
  phraseLang = lang;
  stopAudio();
  renderPhrases();
}

function renderPhrases() {
  const grid = document.getElementById("phraseGrid");
  const langs = Object.keys(country.langs);
  if (!langs.includes(phraseLang)) phraseLang = langs[0];
  const list = data.phrases.filter(p => !isMultiLang() || p.lang === phraseLang);

  const langTabs = isMultiLang() ? `
    <div class="phrase-lang-tabs">
      ${langs.map(l => `<button class="pill ${l === phraseLang ? "active" : ""}" onclick="setPhraseLang('${l}')">
        <span class="lang-badge">${country.langs[l].short}</span> ${country.langs[l].label}</button>`).join("")}
    </div>
    ${phraseLang === "yue" ? `<div class="phrase-lang-note">Spoken in Guangdong, Hong Kong &amp; Macau</div>` : ""}` : "";

  grid.innerHTML = langTabs + PHRASE_CATEGORIES.map(cat => {
    const catPhrases = list.filter(p => p.category === cat);
    if (!catPhrases.length) return "";
    return `
      <div class="phrase-category-label">${CATEGORY_EMOJI[cat]} ${cat}</div>
      ${catPhrases.map(p => `
        <div class="phrase-card" data-id="${p.id}" onclick="playPhrase('${p.id}')">
          <div class="phrase-text">
            <div class="phrase-vi">${esc(p.native)}</div>
            ${p.roman ? `<div class="phrase-roman">${esc(p.roman)}</div>` : ""}
            <div class="phrase-en">${esc(p.en)}</div>
            <div class="phrase-pron">${esc(p.pron)}</div>
          </div>
          <div class="phrase-play">${SPEAKER_SVG(24)}</div>
        </div>`).join("")}`;
  }).join("");
}

// ═══════════════════════════════════════════════
// FILTERS  (Region → City → Type, combinable)
// ═══════════════════════════════════════════════
function initFilterTabs() {
  document.querySelectorAll(".filter-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      activeGroup = tab.dataset.group;
      if (activeGroup === "all") { activeRegion = activeCity = activeType = null; mustTry = false; }
      document.querySelectorAll(".filter-tab").forEach(t => t.classList.toggle("active", t === tab));
      renderPills();
      renderGrid();
    });
  });
}

const regionOfCity = key => (data.cities.find(c => c.key === key) || {}).region;
const regionIcon = key => (data.regions.find(r => r.key === key) || {}).icon || "🗺";

function renderPills() {
  const row = document.getElementById("pillsRow");
  // Update tab labels to show what's selected
  const tabLabel = { region: activeRegion || "Region", city: activeCity || "City", type: activeType || "Type" };
  document.querySelectorAll(".filter-tab").forEach(t => {
    const g = t.dataset.group;
    if (tabLabel[g]) {
      const selected = (g === "region" && activeRegion) || (g === "city" && activeCity) || (g === "type" && activeType);
      t.textContent = tabLabel[g];
      t.classList.toggle("has-value", !!selected);
    }
  });

  row.innerHTML = "";
  const iconicCount = data.dishes.filter(d => d.iconic).length;
  if (iconicCount && iconicCount < data.dishes.length) {
    const star = document.createElement("button");
    star.className = "pill must-try" + (mustTry ? " active" : "");
    star.innerHTML = `⭐ Must-try <span class="pill-count">${iconicCount}</span>`;
    star.onclick = () => { mustTry = !mustTry; renderPills(); renderGrid(); };
    row.appendChild(star);
  }
  if (activeGroup === "all") return;

  let pills = [];
  if (activeGroup === "region") {
    pills = data.regions.map(r => ({ key: r.key, label: r.key, icon: r.icon, active: activeRegion === r.key,
      count: data.dishes.filter(d => matchesRegion(d, r.key)).length }));
  } else if (activeGroup === "city") {
    const cities = data.cities.filter(c => !activeRegion || c.region === activeRegion);
    pills = cities.map(c => ({ key: c.key, label: c.label || c.key, icon: c.icon, active: activeCity === c.key,
      count: data.dishes.filter(d => d.cities.includes(c.key)).length }));
    if (activeRegion) {
      const chip = document.createElement("button");
      chip.className = "pill scope";
      chip.innerHTML = `${regionIcon(activeRegion)} ${esc(activeRegion)} <span class="pill-x">✕</span>`;
      chip.title = "Show cities in all regions";
      chip.onclick = () => { activeRegion = null; activeCity = null; renderPills(); renderGrid(); };
      row.appendChild(chip);
    }
  } else if (activeGroup === "type") {
    pills = data.types.map(t => ({ key: t.key, label: t.key, icon: t.icon, active: activeType === t.key,
      count: data.dishes.filter(d => d.types.includes(t.key)).length }));
  }

  pills.filter(p => p.count > 0).forEach(p => {
    const btn = document.createElement("button");
    btn.className = "pill" + (p.active ? " active" : "");
    btn.innerHTML = `<span class="pill-icon">${p.icon}</span> ${esc(p.label)} <span class="pill-count">${p.count}</span>`;
    btn.onclick = () => {
      if (activeGroup === "region") {
        activeRegion = activeRegion === p.key ? null : p.key;
        if (activeCity && regionOfCity(activeCity) !== activeRegion) activeCity = null;
      } else if (activeGroup === "city") {
        activeCity = activeCity === p.key ? null : p.key;
        if (activeCity) activeRegion = regionOfCity(activeCity) || activeRegion;
      } else {
        activeType = activeType === p.key ? null : p.key;
      }
      renderPills();
      renderGrid();
    };
    row.appendChild(btn);
  });
}

// A dish belongs to a region if it is from there or is served in one of its cities
function matchesRegion(d, region) {
  return d.region === region || d.cities.some(c => regionOfCity(c) === region);
}

// ═══════════════════════════════════════════════
// GRID RENDERING
// ═══════════════════════════════════════════════
function fold(s) {
  return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "d").toLowerCase();
}

function getFilteredDishes() {
  let result = data.dishes;
  if (activeCity) result = result.filter(d => d.cities.includes(activeCity));
  else if (activeRegion) result = result.filter(d => matchesRegion(d, activeRegion));
  if (activeType) result = result.filter(d => d.types.includes(activeType));
  if (mustTry) result = result.filter(d => d.iconic);

  if (searchQuery) {
    const q = fold(searchQuery);
    const qCompact = q.replace(/[\s'-]/g, "");
    result = result.filter(d =>
      d.native.includes(searchQuery) ||
      fold(d.native).includes(q) ||
      fold(d.roman).includes(q) || fold(d.roman).replace(/[\s'-]/g, "").includes(qCompact) ||
      d.en.toLowerCase().includes(q) ||
      d.id.replace(/-/g, "").includes(qCompact) ||
      (d.ingredients || []).some(i => i.toLowerCase().includes(q)) ||
      d.types.some(t => t.toLowerCase().includes(q))
    );
  }
  return result;
}

function describeFilters(n) {
  const parts = [];
  if (mustTry) parts.push("must-try");
  if (activeType) parts.push(activeType);
  const where = activeCity || activeRegion;
  let s = `${n} ${parts.join(" ")}${parts.length ? " " : ""}dish${n !== 1 ? "es" : ""}`;
  if (where) s += ` in ${where}`;
  return s;
}

function renderGrid() {
  const grid = document.getElementById("grid");
  const label = document.getElementById("resultsLabel");
  const filtered = getFilteredDishes();
  document.getElementById("dishCount").textContent = filtered.length;

  if (filtered.length === 0) {
    label.innerHTML = searchQuery ? `No dishes match "<strong>${esc(searchQuery)}</strong>"` : "No dishes match this filter";
    grid.innerHTML = `<div class="empty-state"><span class="emoji">🥢</span><p>No dishes found.<br>Try a different search or filter!</p></div>`;
    return;
  }

  const anyFilter = activeRegion || activeCity || activeType || mustTry;
  label.textContent = searchQuery
    ? `${filtered.length} result${filtered.length !== 1 ? "s" : ""} for "${searchQuery}"`
    : anyFilter ? `Showing ${describeFilters(filtered.length)}` : `Showing all ${filtered.length} ${country.name} dishes`;

  grid.innerHTML = filtered.map(d => {
    const lang = isMultiLang() ? langOf(d) : null;
    return `
    <div class="card" data-id="${d.id}" onclick="openSheet('${d.id}')">
      <div class="card-img-wrap">
        <div class="img-placeholder">${d.emoji}</div>
        ${d.img ? `<img class="loading" src="${d.img}" alt="${esc(d.en)}" loading="lazy" decoding="async"
          onload="this.classList.remove('loading');this.classList.add('loaded')"
          onerror="this.style.display='none'">` : ""}
        ${lang && d.lang === "yue" ? `<div class="lang-flag" title="${lang.label}">${lang.short} ${lang.label}</div>` : ""}
        ${d.iconic && !mustTry && data.dishes.some(x => !x.iconic) ? `<div class="iconic-star" title="Must-try">⭐</div>` : ""}
        <div class="play-badge" onclick="event.stopPropagation(); playDishById('${d.id}')">🔊</div>
      </div>
      <div class="card-body">
        <div class="card-vi ${d.roman ? "cjk" : ""}">${esc(d.native)}</div>
        ${d.roman ? `<div class="card-roman">${esc(d.roman)}</div>` : ""}
        <div class="card-en">${esc(d.en)}</div>
        <div class="card-tags">
          <span class="tag region">${esc(d.region)}</span>
          ${d.cities.filter(c => c !== d.region).map(c => `<span class="tag city">${esc(c)}</span>`).join("")}
        </div>
      </div>
    </div>`;
  }).join("");
}

// ═══════════════════════════════════════════════
// DETAIL SHEET
// ═══════════════════════════════════════════════
function openSheet(id) {
  const dish = dishById(id);
  if (!dish) return;
  currentDish = dish;
  const lang = langOf(dish);

  const img = document.getElementById("sheetImg");
  if (dish.img) { img.src = dish.img; img.alt = dish.en; img.style.display = ""; }
  else { img.removeAttribute("src"); img.style.display = "none"; }
  const nameEl = document.getElementById("sheetViName");
  nameEl.textContent = dish.native;
  nameEl.classList.toggle("cjk", !!dish.roman);
  const romanEl = document.getElementById("sheetRoman");
  romanEl.textContent = dish.roman || "";
  romanEl.style.display = dish.roman ? "" : "none";
  document.getElementById("sheetEnName").textContent = dish.en;
  document.getElementById("sheetPronLabel").textContent = isMultiLang() ? `Say (${lang.label}):` : "Say:";
  document.getElementById("sheetPronText").textContent = dish.pron;
  document.getElementById("sheetDesc").textContent = dish.desc;

  document.getElementById("sheetMeta").innerHTML = `
    <span class="meta-chip country">${country.flag} ${esc(country.name)}</span>
    <span class="meta-chip region">🗺 ${esc(dish.region)}</span>
    ${dish.cities.filter(c => c !== dish.region).map(c => `<span class="meta-chip city">📍 ${esc(c)}</span>`).join("")}
    ${dish.types.map(t => `<span class="meta-chip type">${esc(t)}</span>`).join("")}`;

  document.getElementById("sheetIngredients").innerHTML =
    (dish.ingredients || []).map(i => `<span class="ingredient-chip">${esc(i)}</span>`).join("");

  setSheetPlaying(false);
  document.getElementById("sheetOverlay").classList.add("open");
  const sheet = document.getElementById("sheet");
  sheet.scrollTop = 0;
  sheet.classList.add("open");
  document.body.style.overflow = "hidden";
  history.pushState({ dish: id }, "");
}

function hideSheet() {
  stopAudio();
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("sheetOverlay").classList.remove("open");
  document.body.style.overflow = "";
  currentDish = null;
}

function closeSheet() {
  if (!document.getElementById("sheet").classList.contains("open")) return;
  hideSheet();
  history.back();
}

// Hardware back button / browser back → close whatever is open
window.addEventListener("popstate", () => {
  if (document.getElementById("sheet").classList.contains("open")) hideSheet();
  if (document.getElementById("countrySheet").classList.contains("open")) closeCountryPicker(true);
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeSheet(); closeCountryPicker(); }
});

// Swipe down to close sheet
let touchStartY = 0;
document.getElementById("sheet").addEventListener("touchstart", e => { touchStartY = e.touches[0].clientY; }, { passive: true });
document.getElementById("sheet").addEventListener("touchend", e => {
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (dy > 80 && document.getElementById("sheet").scrollTop <= 0) closeSheet();
}, { passive: true });

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
initFilterTabs();
(async () => {
  const saved = store("nnn-country");
  const fromUrl = new URLSearchParams(location.search).get("country");
  const id = COUNTRIES.some(c => c.id === fromUrl) ? fromUrl : (COUNTRIES.some(c => c.id === saved) ? saved : "vn");
  try {
    await selectCountry(id, { save: !!fromUrl });
  } catch (e) {
    console.error(e);
    document.getElementById("grid").innerHTML = `<div class="empty-state"><span class="emoji">📡</span><p>Couldn't load dishes.<br>Check your connection and reload.</p></div>`;
  }
})();

// Pre-load voices on iOS (must be triggered after a user gesture)
document.addEventListener("touchstart", () => {
  if (window.speechSynthesis) speechSynthesis.getVoices();
}, { once: true });

// ── PWA Service Worker ──
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(reg => console.log("[SW] Registered:", reg.scope))
      .catch(err => console.warn("[SW] Registration failed:", err));
  });
}
